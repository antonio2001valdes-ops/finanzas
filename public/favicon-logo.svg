<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
  <defs>
    <linearGradient id="k-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05d9e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#01ff89;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark rounded square background -->
  <rect x="2" y="2" width="26" height="26" rx="5" ry="5" fill="#0d0d1a" stroke="#05d9e8" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- Inner border glow -->
  <rect x="3.5" y="3.5" width="23" height="23" rx="3.5" ry="3.5" fill="none" stroke="#05d9e8" stroke-width="0.3" stroke-opacity="0.25"/>
  <!-- K letter - stylized cyberpunk -->
  <g filter="url(#glow)">
    <!-- K vertical stem -->
    <rect x="8" y="6.5" width="3" height="17" rx="1" fill="url(#k-grad)"/>
    <!-- K upper diagonal -->
    <polygon points="11,15 18.5,6.5 21.5,6.5 13.5,15" fill="url(#k-grad)"/>
    <!-- K lower diagonal -->
    <polygon points="11,15 21.5,23.5 18.5,23.5 11,16 13.5,15" fill="url(#k-grad)"/>
  </g>
</svg>
